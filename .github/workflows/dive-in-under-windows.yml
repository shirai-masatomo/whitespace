name: Dive In Under Windows foundation
on:
  pull_request:
    paths:
      - 'projects/dive-in-under/core/**'
      - 'projects/dive-in-under/ui/**'
      - 'projects/dive-in-under/data/**'
      - 'projects/dive-in-under/assets/**'
      - 'projects/dive-in-under/tests/**'
      - 'projects/dive-in-under/tools/**'
      - 'projects/dive-in-under/*.godot'
      - 'projects/dive-in-under/*.cfg'
      - 'projects/dive-in-under/*.ps1'
      - '.github/workflows/dive-in-under-windows.yml'
  push:
    # Open development PRs run once via pull_request, avoiding duplicate push runs.
    branches: ['main']
    paths:
      - 'projects/dive-in-under/core/**'
      - 'projects/dive-in-under/ui/**'
      - 'projects/dive-in-under/data/**'
      - 'projects/dive-in-under/assets/**'
      - 'projects/dive-in-under/tests/**'
      - 'projects/dive-in-under/tools/**'
      - 'projects/dive-in-under/*.godot'
      - 'projects/dive-in-under/*.cfg'
      - 'projects/dive-in-under/*.ps1'
      - '.github/workflows/dive-in-under-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dive-in-under-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: projects/dive-in-under
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            projects/dive-in-under
          sparse-checkout-cone-mode: true
      - name: Select verification for the changed files
        id: scope
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $adventure = Test-Path tools/adventure-stage.txt
          "adventure_only=$($adventure.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($adventure) { $global:LASTEXITCODE=0; return }
          $reviewFixes = Test-Path tools/review-fixes-stage.txt
          "review_fixes=$($reviewFixes.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $flowOnly = Test-Path tools/flow-stage.txt
          "flow_only=$($flowOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $journeyOnly = Test-Path tools/journey-stage.txt
          if ($journeyOnly) { ./tools/journey_scope.ps1 }
          "journey_only=$($journeyOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $integrationOnly = $false
          if (Test-Path ui/play_view.gd) {
            git diff --exit-code a5c3c6925fbc501d24ce84ccfa1f2fbbeed74456 HEAD -- core data | Out-Null
            $integrationOnly = $LASTEXITCODE -eq 0
          }
          $artOnly = $false
          $statusOnly = $false
          $statusFrom = $env:PREVIOUS_HEAD
          if ($statusFrom -notmatch '^[0-9a-f]{40}$' -or $statusFrom -eq ('0' * 40)) { $statusFrom = "$($env:CURRENT_HEAD)^" }
          git cat-file -e "$statusFrom^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and '${{ github.event.action }}' -eq 'synchronize') {
            $statusFiles = @(git diff --name-only $statusFrom $env:CURRENT_HEAD)
            $statusAllowed = '^(projects/dive-in-under/(review/|docs/)|projects/dive-in-under/ui/(status_view|status_model|status_review|status_symbols|enemy_art_review|game)\.gd(\.uid)?$|projects/dive-in-under/data/v1/hero-profile\.json$|projects/dive-in-under/(export_presets\.cfg|project\.godot)$|projects/dive-in-under/tools/(enemy_art_review|publish_local)\.ps1$|\.github/workflows/dive-in-under-windows\.yml$)'
            $statusOnly = @($statusFiles | Where-Object { $_ -match 'ui/status_(view|model|review|symbols)\.gd$' }).Count -gt 0 -and @($statusFiles | Where-Object { $_ -notmatch $statusAllowed }).Count -eq 0
          }
          if ($env:PREVIOUS_HEAD -match '^[0-9a-f]{40}$' -and $env:PREVIOUS_HEAD -ne ('0' * 40)) {
            git cat-file -e "$($env:PREVIOUS_HEAD)^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $files = @(git diff --name-only $env:PREVIOUS_HEAD $env:CURRENT_HEAD)
              $allowed = '^(projects/dive-in-under/(assets/visual-candidates/|review/|docs/)|projects/dive-in-under/ui/(visual_assets|battle_stage|game|enemy_art_review)\.gd(\.uid)?$|projects/dive-in-under/export_presets\.cfg$|projects/dive-in-under/tools/enemy_art_review\.ps1$|\.github/workflows/dive-in-under-windows\.yml$)'
              $artOnly = $files.Count -gt 0 -and @($files | Where-Object { $_ -notmatch $allowed }).Count -eq 0
            }
          }
          $refinementOnly = $false
          if (Test-Path tools/refinement_scope.ps1) {
            $allowedRefinement = '^(projects/dive-in-under/(review/|docs/|assets/equipment/)|projects/dive-in-under/ui/(refinement_review|slot_silhouette|game|play_view|status_view|ui_skin|equipment_art|warehouse_view)\.gd(\.uid)?$|projects/dive-in-under/core/expedition\.gd$|projects/dive-in-under/(project\.godot|export_presets\.cfg)$|projects/dive-in-under/tools/(refinement_scope|refinement_review|refinement_before|publish_refinement)\.(ps1|gd)$|\.github/workflows/dive-in-under-windows\.yml$)'
            $refinementFiles = @(git diff --name-only 1a8da5b HEAD)
            if (@($refinementFiles | Where-Object { $_ -notmatch $allowedRefinement }).Count -eq 0) {
              ./tools/refinement_scope.ps1
              $refinementOnly = $true
              $integrationOnly = $true
            }
          }
          "refinement_only=$($refinementOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $titleOnly = $false
          if ($integrationOnly -and (Test-Path ui/title_review.gd) -and $env:PREVIOUS_HEAD -match '^[0-9a-f]{40}$' -and $env:PREVIOUS_HEAD -ne ('0' * 40)) {
            $titleFiles = @(git diff --name-only $env:PREVIOUS_HEAD $env:CURRENT_HEAD)
            $titleAllowed = '^(projects/dive-in-under/(review/|docs/|assets/title/)|projects/dive-in-under/ui/(title_review|game|play_view)\.gd(\.uid)?$|projects/dive-in-under/(project\.godot|export_presets\.cfg)$|projects/dive-in-under/tools/(title_review|publish_title)\.ps1$|\.github/workflows/dive-in-under-windows\.yml$)'
            $titleOnly = @($titleFiles | Where-Object { $_ -match '(title_review|publish_title|assets/title)' }).Count -gt 0 -and @($titleFiles | Where-Object { $_ -notmatch $titleAllowed }).Count -eq 0
          }
          "title_only=$($titleOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $bgmOnly = $false
          if ($integrationOnly -and (Test-Path ui/bgm_review.gd) -and $env:PREVIOUS_HEAD -match '^[0-9a-f]{40}$' -and $env:PREVIOUS_HEAD -ne ('0' * 40)) {
            $bgmFiles = @(git diff --name-only $env:PREVIOUS_HEAD $env:CURRENT_HEAD)
            $bgmAllowed = '^(projects/dive-in-under/(review/|docs/|assets/bgm/)|projects/dive-in-under/ui/(preparation_music|bgm_review|game|play_view|feedback_review)\.gd(\.uid)?$|projects/dive-in-under/(project\.godot|export_presets\.cfg)$|projects/dive-in-under/tools/(bgm_review|publish_bgm)\.ps1$|\.github/workflows/dive-in-under-windows\.yml$)'
            $bgmOnly = @($bgmFiles | Where-Object { $_ -match '(preparation_music|bgm_review|publish_bgm|assets/bgm)' }).Count -gt 0 -and @($bgmFiles | Where-Object { $_ -notmatch $bgmAllowed }).Count -eq 0
          }
          "bgm_only=$($bgmOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($journeyOnly) { $integrationOnly = $true }
          $feedbackOnly = !$journeyOnly -and $integrationOnly -and (Test-Path ui/feedback_review.gd) -and !$bgmOnly -and !$titleOnly -and !$refinementOnly
          "feedback_only=$($feedbackOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "integration_only=$($integrationOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
          "art_only=$($artOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "status_only=$($statusOnly.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Output "Art-only verification: $artOnly (previously verified core/data unchanged)"
          Write-Output "Status-only verification: $statusOnly"
      - uses: actions/cache@v4
        with:
          path: projects/dive-in-under/.tools
          key: dive-in-under-godot-${{ runner.os }}-${{ hashFiles('projects/dive-in-under/tools/godot-version.json') }}
      - name: Verify engine and templates
        run: ./tools/setup.ps1
      - name: Adventure rule checkpoint, bounded focused cases
        if: steps.scope.outputs.adventure_only == 'true'
        timeout-minutes: 3
        run: ./tools/adventure_core.ps1
      - name: Export grouped adventure candidate
        if: steps.scope.outputs.adventure_only == 'true' && hashFiles('projects/dive-in-under/tools/adventure-ready.txt') != '' && hashFiles('projects/dive-in-under/tools/tactics-stage.txt') == ''
        run: ./dev.ps1 -Task build -GameCommit '${{ github.sha }}'
      - name: Grouped adventure, one isolated EXE
        if: steps.scope.outputs.adventure_only == 'true' && hashFiles('projects/dive-in-under/tools/adventure-ready.txt') != '' && hashFiles('projects/dive-in-under/tools/tactics-stage.txt') == ''
        timeout-minutes: 6
        run: ./tools/adventure_review.ps1
      - name: Functional tests, 8-seed smoke and export
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./dev.ps1 -Task verify -Trials 8 -GameCommit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Repeat same seeds and compare
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./dev.ps1 -Task simulate -Trials 8 -GameCommit '${{ github.event.pull_request.head.sha || github.sha }}' -Baseline "$PWD/artifacts/simulation.json" -Output "$PWD/artifacts/comparison.json" -StrictRepeat
      - name: Three fixed campaigns and strict replay
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./tools/verify_campaign.ps1 -Trials 3 -GameCommit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Replay normal 10F with three exported EXE processes
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: |
          ./tools/campaign_smoke.ps1
          ./tests/test_campaign_harness.ps1
      - name: Run exported Windows EXE (headless UI smoke)
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./tools/smoke.ps1
      - name: Migrate legacy saves in exported EXE and restart
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./tools/migration_smoke.ps1
      - name: Repair exported equipment and reopen save
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: |
          ./tools/enemy_art_review.ps1 -Review equipment
          ./tools/enemy_art_review.ps1 -Review equipment -Resume
      - name: Warehouse transfer, filtering and separate restart
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: |
          ./tools/enemy_art_review.ps1 -Review warehouse
          ./tools/enemy_art_review.ps1 -Review warehouse -Resume
      - name: Blue starter cloak, item artwork, transfers and separate restart
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: |
          ./tools/enemy_art_review.ps1 -Isolated -Review equipment-assets
          ./tools/enemy_art_review.ps1 -Isolated -Review equipment-assets -Resume
      - name: Reject injected replay and UI smoke faults
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.status_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./tests/test_harness.ps1
      - name: Export status-only UI update
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.status_only == 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./dev.ps1 -Task build -GameCommit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Status tabs, selections, keyboard, return and read-only save
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only != 'true' && steps.scope.outputs.integration_only != 'true')
        run: |
          ./tools/enemy_art_review.ps1 -Isolated -Review status
          ./tools/enemy_art_review.ps1 -Isolated -Review status -Resume
          ./tools/smoke.ps1
      - name: Import and export unchanged-core art update
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only == 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./dev.ps1 -Task build -GameCommit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Targeted exported EXE image and first-return smoke
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.art_only == 'true' && steps.scope.outputs.integration_only != 'true')
        run: ./tools/enemy_art_review.ps1
      - name: Focused journey core checkpoint
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.journey_only == 'true')
        timeout-minutes: 3
        run: |
          $env:APPDATA = "$PWD/artifacts/journey-core-user"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $engine = "$PWD/.tools/Godot_v4.7.2-stable_win64_console.exe"
          $entries = @(@('--editor','--import','--quit'),@('--script','tests/test_journey.gd'),@('--script','tests/test_storage.gd'),@('--script','tests/test_equipment_condition.gd'))
          if (Test-Path tools/flow-stage.txt) { $entries += ,@('--script','tests/test_flow.gd') }
          if (Test-Path tools/review-fixes-stage.txt) { $entries += ,@('--script','tests/test_review_fixes.gd') }
          foreach ($entry in $entries) {
            $label = if ($entry[0] -eq '--editor') { 'import' } else { [IO.Path]::GetFileNameWithoutExtension($entry[1]) }
            $log = "$PWD/artifacts/journey-$label.log"
            $arguments = @('--headless','--path',"$PWD",'--log-file',$log) + $entry
            $process = Start-Process -FilePath $engine -ArgumentList (($arguments | ForEach-Object { '"' + $_ + '"' }) -join ' ') -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(45000)) { $process.Kill(); if (Test-Path $log) { Get-Content $log | Select-Object -Last 35 }; throw 'Focused core/import timeout' }
            $process.Refresh()
            if ($process.ExitCode -ne 0 -or (Select-String -LiteralPath $log -Pattern 'SCRIPT ERROR:|^ERROR:' -Quiet)) { Get-Content $log; throw 'Focused core/import failed' }
            Get-Content $log | Select-Object -Last 4
          }
      - name: Export selected UI or journey build
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.integration_only == 'true' && ((steps.scope.outputs.review_fixes == 'true' && hashFiles('projects/dive-in-under/tools/review-fixes-ready.txt') != '') || (steps.scope.outputs.flow_only == 'true' && steps.scope.outputs.review_fixes != 'true' && hashFiles('projects/dive-in-under/tools/flow-ready.txt') != '') || (steps.scope.outputs.flow_only != 'true' && (steps.scope.outputs.journey_only != 'true' || hashFiles('projects/dive-in-under/tools/journey-ready.txt') != ''))))
        run: ./dev.ps1 -Task build -GameCommit '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: One normal journey and focused safety fixtures in isolated exported EXE
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.journey_only == 'true' && steps.scope.outputs.flow_only != 'true' && hashFiles('projects/dive-in-under/tools/journey-ready.txt') != '')
        timeout-minutes: 6
        run: ./tools/journey_review.ps1
      - name: Review defects and presentation, one focused isolated EXE
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.review_fixes == 'true' && hashFiles('projects/dive-in-under/tools/review-fixes-ready.txt') != '')
        timeout-minutes: 3
        run: ./tools/review_fixes.ps1
      - name: Focused exploration controls in one isolated exported EXE
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.flow_only == 'true' && steps.scope.outputs.review_fixes != 'true' && hashFiles('projects/dive-in-under/tools/flow-ready.txt') != '')
        timeout-minutes: 3
        run: ./tools/flow_review.ps1
      - name: Isolated session UI, transitions, comparison screenshots and fresh restart
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.integration_only == 'true' && steps.scope.outputs.feedback_only != 'true' && steps.scope.outputs.bgm_only != 'true' && steps.scope.outputs.title_only != 'true' && steps.scope.outputs.refinement_only != 'true' && steps.scope.outputs.journey_only != 'true')
        timeout-minutes: 4
        run: ./tools/ui_integration_review.ps1
      - name: Focused feedback 01-07, one isolated EXE process
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.feedback_only == 'true')
        timeout-minutes: 2
        run: ./tools/ui_feedback_review.ps1
      - name: Preparation BGM, one isolated EXE process
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.bgm_only == 'true')
        timeout-minutes: 2
        run: ./tools/bgm_review.ps1
      - name: Title logo, Start and Exit, one isolated EXE process
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.title_only == 'true')
        timeout-minutes: 2
        run: ./tools/title_review.ps1
      - name: Targeted UI refinement and input fixes, sequential isolated before and after
        if: steps.scope.outputs.adventure_only != 'true' && (steps.scope.outputs.refinement_only == 'true')
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/refinement_review.ps1 -AfterOnly
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.adventure_only != 'true' && (always())
        with:
          name: DiveInUnder-foundation-windows-x64
          path: projects/dive-in-under/build/DiveInUnder-foundation-windows-x64.zip
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.adventure_only != 'true' && (always())
        with:
          name: DiveInUnder-foundation-evidence
          path: |
            projects/dive-in-under/artifacts/review-fixes/**/*.png
            projects/dive-in-under/artifacts/review-fixes/**/*.json
            projects/dive-in-under/artifacts/review-fixes/**/*.log
            projects/dive-in-under/artifacts/flow/**/*.png
            projects/dive-in-under/artifacts/flow/**/*.json
            projects/dive-in-under/artifacts/flow/**/*.log
            projects/dive-in-under/artifacts/journey/**/*.png
            projects/dive-in-under/artifacts/journey/**/*.json
            projects/dive-in-under/artifacts/journey/**/*.log
            projects/dive-in-under/artifacts/refinement/before/*.png
            projects/dive-in-under/artifacts/refinement/before/*.json
            projects/dive-in-under/artifacts/refinement/before/*.log
            projects/dive-in-under/artifacts/refinement/after/*.png
            projects/dive-in-under/artifacts/refinement/after/*.json
            projects/dive-in-under/artifacts/refinement/after/*.log
            projects/dive-in-under/artifacts/title/*.json
            projects/dive-in-under/artifacts/title/*.log
            projects/dive-in-under/artifacts/title/*.png
            projects/dive-in-under/artifacts/bgm/*.json
            projects/dive-in-under/artifacts/bgm/*.log
            projects/dive-in-under/artifacts/bgm/*.wav
            projects/dive-in-under/artifacts/bgm/*.png
            projects/dive-in-under/artifacts/ui-feedback/*.png
            projects/dive-in-under/artifacts/ui-feedback/*.json
            projects/dive-in-under/artifacts/ui-feedback/*.log
            projects/dive-in-under/artifacts/ui-integration/*.png
            projects/dive-in-under/artifacts/ui-integration/*.json
            projects/dive-in-under/artifacts/ui-integration/*.log
            projects/dive-in-under/artifacts/*.log
            projects/dive-in-under/artifacts/*.json
            projects/dive-in-under/artifacts/*.txt
            projects/dive-in-under/artifacts/equipment-assets-isolated/*.json
            projects/dive-in-under/artifacts/equipment-assets-isolated/*.log
            projects/dive-in-under/artifacts/equipment-assets-isolated/*.png
            projects/dive-in-under/artifacts/status-isolated/*.json
            projects/dive-in-under/artifacts/status-isolated/*.log
            projects/dive-in-under/artifacts/status-isolated/*.png
            projects/dive-in-under/artifacts/status-headless/*.json
            projects/dive-in-under/artifacts/status-headless/*.log
            projects/dive-in-under/artifacts/warehouse-headless/*.json
            projects/dive-in-under/artifacts/warehouse-headless/*.log
            projects/dive-in-under/artifacts/equipment-headless/*.json
            projects/dive-in-under/artifacts/equipment-headless/*.log
            projects/dive-in-under/artifacts/enemy-art-headless/*.json
            projects/dive-in-under/artifacts/enemy-art-headless/*.log
            projects/dive-in-under/artifacts/exe-headless/run.log
            projects/dive-in-under/artifacts/exe-headless/*.json
            projects/dive-in-under/artifacts/campaign-headless/*.json
            projects/dive-in-under/artifacts/campaign-headless/*.log
            projects/dive-in-under/artifacts/migration-headless/**/*.json
            projects/dive-in-under/artifacts/migration-headless/**/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.adventure_only == 'true'
        with:
          name: DiveInUnder-adventure-evidence
          path: |
            projects/dive-in-under/artifacts/adventure-*.log
            projects/dive-in-under/artifacts/adventure/**/*.json
            projects/dive-in-under/artifacts/tactics/**/*.json
            projects/dive-in-under/artifacts/adventure/**/*.png
            projects/dive-in-under/artifacts/adventure/**/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success() && steps.scope.outputs.adventure_only == 'true' && hashFiles('projects/dive-in-under/tools/adventure-ready.txt') != '' && hashFiles('projects/dive-in-under/tools/tactics-stage.txt') == ''
        with:
          name: DiveInUnder-adventure-windows-x64
          path: projects/dive-in-under/build/DiveInUnder-foundation-windows-x64.zip
          if-no-files-found: error
