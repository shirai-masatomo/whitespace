name: WHISTLE RANCH

on:
  push:
    branches: [main, 'codex/sporehollow-*']
    paths: ['projects/sporehollow/**', '.github/workflows/sporehollow.yml']
  pull_request:
    paths: ['projects/sporehollow/**', '.github/workflows/sporehollow.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: projects/sporehollow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            projects/sporehollow/.tools/*.exe
            projects/sporehollow/.tools/templates
          key: whistle-ranch-godot-4.7.2-v1
      - name: Install verified native tools
        run: ./tools/setup.ps1
      - name: Rules, intervention comparison, Windows export and exe smoke
        run: ./dev.ps1 check
      - uses: actions/upload-artifact@v4
        with:
          name: WhistleRanch-windows
          path: projects/sporehollow/build/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhistleRanch-observations
          path: |
            projects/sporehollow/artifacts/*.json
            projects/sporehollow/artifacts/*.log
