: "review-4a89f18f88759a2676ac", "title": "落ち込んだ日に、抱きしめてもらう", "kind": "scene", "place": "その他・場所確認待ち", "note": "既存の完成参考画像。背景・人物が統合された試作を含む。室内の旧版は履物未確認。", "files": [{"file": "09_comfort_42006_00001_.png", "sha256": "e71757190399eb0620d2eb45a36baebed3ad0bcd6c129fd536b628216279d91b", "url": "../media/e71757190399eb0620d2.png"}], "initial_status": "unreviewed", "lifecycle": "current", "history_reason": "", "revision": "ff64f82bc027d2b804597f60285830983b607ea1e367a392187c47044ec528b4", "official": null}, {"id": "review-5f2a6233d13a0c82e572", "title": "返事を聞いて、ほっと笑う", "kind": "scene", "place": "その他・場所確認待ち", "note": "既存の完成参考画像。背景・人物が統合された試作を含む。室内の旧版は履物未確認。", "files": [{"file": "06_reply_42006_00001_.png", "sha256": "3a56a15bdda70f1bcbdaa76c05f2cf834ceddcc0a91e7c2a11e9fc6c381f54da", "url": "../media/3a56a15bdda70f1bcbda.png"}], "initial_status": "unreviewed", "lifecycle": "current", "history_reason": "", "revision": "4ed13d1ffc79bac7b467d34ef6ebfee47913c8fdba14d72e70e1a5a05877936f", "official": null}], "labels": {"scene": "シーン", "person": "人物・表情・ポーズ", "location": "背景・場所", "effect": "文字・エフェクト", "part": "部品・顔パッチ"}, "places": ["heroine-home/bedroom", "heroine-home/living", "heroine-home/kitchen", "heroine-home/bathroom", "heroine-home/toilet", "heroine-home/entrance", "library", "beach", "hotel", "izakaya-private-room", "cafe", "outdoors"]}</script><script>'use strict';
const D=JSON.parse(document.querySelector('#data').textContent);
const STORE='whitespace.develop.review.v1',$=s=>document.querySelector(s),kind=$('#kind'),place=$('#place'),view=$('#view'),list=$('#list');
const stateLabels={unreviewed:'未確認',approved:'OK',hold:'保留',rejected:'不採用',revise:'修正待ち',archived:'旧版へ'};
const validStates=new Set(Object.keys(stateLabels));
let saved={},limit=36,storageAvailable=true;
try{saved=JSON.parse(localStorage.getItem(STORE)||'{}');if(!saved||Array.isArray(saved)||typeof saved!=='object')saved={};}catch{storageAvailable=false;}
const key=r=>r.id+'@'+r.revision;
function effective(r){const value=saved[key(r)]||r.official||{status:r.initial_status,note:'',place:r.place};return validStates.has(value.status)?value:{status:'unreviewed',note:'',place:r.place};}
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
function notice(text){$('#status').textContent=text;}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(saved));}catch{storageAvailable=false;}if(!storageAvailable)notice('この環境ではブラウザー保存が使えません。「採否を保存」で必ずファイルへ保存してください。');}
function update(r,patch){const prev=effective(r);saved[key(r)]={...prev,...patch,id:r.id,revision:r.revision,updated_at:new Date().toISOString()};persist();}
function isOfficial(r){return (r.official?r.official.status==='approved':r.initial_status==='approved')&&(!saved[key(r)]||saved[key(r)].status==='approved');}
function isHistory(r){return r.lifecycle==='history'||['rejected','archived'].includes(effective(r).status);}
function matches(r){const v=effective(r),text=(r.title+' '+r.note+' '+(v.note||'')).toLowerCase();return(kind.value==='all'||r.kind===kind.value)&&(place.value==='all'||(v.place||r.place||'共通')===place.value)&&text.includes($('#search').value.toLowerCase())&&(view.value==='all'||view.value==='history'&&isHistory(r)||view.value==='approved'&&isOfficial(r)||view.value==='pending'&&!isHistory(r)&&!isOfficial(r));}
for(const [value,text] of Object.entries(D.labels)){const o=node('option',text);o.value=value;kind.append(o);}
if(D.scope!=='all')kind.value=D.scope;
function places(){const old=place.value;place.replaceChildren();const any=node('option','すべて');any.value='all';place.append(any);for(const p of [...new Set(D.rows.filter(r=>kind.value==='all'||r.kind===kind.value).map(r=>effective(r).place||r.place||'共通'))].sort()){const o=node('option',p);o.value=p;place.append(o);}if([...place.children].some(x=>x.value===old))place.value=old;}
function show(reset=true){if(reset)limit=36;list.replaceChildren();const rows=D.rows.filter(matches);$('#count').textContent=rows.length+'件';$('#more').hidden=rows.length<=limit;
 if(!rows.length){const empty=node('p','この条件の素材はありません。');empty.className='empty';list.append(empty);}
 for(const r of rows.slice(0,limit)){
  const article=node('article');article.dataset.kind=r.kind;
  const figure=node('figure'),usable=r.files.filter(x=>x.url),preview=usable.find(x=>/\.gif(?:$|\?)/i.test(x.url))||usable[0];
  if(preview){const a=node('a');a.href=preview.url;const img=node('img');img.src=preview.url;img.alt=r.title;img.loading='lazy';a.append(img);figure.append(a);}else figure.append(node('p','この版の原本は現在の場所にありません。新しい画像の採否には引き継ぎません。'));
  const variants=node('div');for(const f of usable){const a=node('a',f.file.split('/').pop());a.href=f.url;variants.append(a,node('span','　'));}figure.append(variants);article.append(figure);
  const aside=node('aside');aside.append(node('h2',r.title));const badge=node('p');badge.className='badge';
  const v=effective(r);badge.textContent=r.official?'正式台帳：'+stateLabels[r.official.status]+' ／ 現在：'+stateLabels[v.status]:(r.initial_status==='approved'?'既存台帳：採用済み ／ ':'')+stateLabels[v.status]+(saved[key(r)]?'（正式反映前）':'');aside.append(badge);
  const choices=node('div');choices.className='choices';for(const s of ['approved','hold','rejected','revise','archived']){const b=node('button',stateLabels[s]);b.type='button';b.disabled=s==='approved'&&usable.length!==r.files.length;b.setAttribute('aria-pressed',String(v.status===s));b.addEventListener('click',()=>{update(r,{status:s});show(false);});choices.append(b);}aside.append(choices);
  const note=node('textarea');note.value=v.note||'';note.placeholder='ここにメモ（例：OK、色だけ修正）';note.setAttribute('aria-label',r.title+'の採否メモ');note.addEventListener('input',()=>update(r,{note:note.value}));aside.append(note);
  if(r.kind==='scene'){const label=node('label','格納場所 '),select=node('select');for(const p of [...new Set([r.place||'場所未分類',...D.places])]){const o=node('option',p);o.value=p;select.append(o);}select.value=v.place||r.place;select.addEventListener('change',()=>{update(r,{place:select.value});places();});label.append(select);aside.append(label);}
  aside.append(node('p',r.note||''));if(r.lifecycle==='history')aside.append(node('small','履歴：'+r.history_reason));
  const detail=node('details');detail.append(node('summary','版と保存先（'+r.files.length+'形式）'),node('small',r.files.map(f=>f.file+' / '+f.sha256).join('\n')));aside.append(detail);article.append(aside);list.append(article);
 }
}
function exportData(){const decisions=Object.values(saved).filter(d=>D.rows.some(r=>r.id===d.id&&r.revision===d.revision));return {schema:1,type:'whitespace-development-decisions',exported_at:new Date().toISOString(),decisions};}
function importData(data){if(data.schema!==1||data.type!=='whitespace-development-decisions'||!Array.isArray(data.decisions))throw new Error('この一覧の採否JSONではありません。');const accepted=[],rejected=[];for(const d of data.decisions){const r=D.rows.find(r=>r.id===d.id&&r.revision===d.revision);if(!r||!validStates.has(d.status)||typeof(d.note||'')!=='string'||(d.place&&typeof d.place!=='string')){rejected.push(d.id||'不明');continue;}accepted.push([key(r),{...d,note:d.note||'',place:d.place||r.place}]);}for(const [k,v] of accepted)saved[k]=v;persist();places();show();notice(accepted.length+'件読み込み。版違い／不正 '+rejected.length+'件は未反映。');return {accepted:accepted.length,rejected:rejected.length};}
$('#export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='develop-decisions-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notice('採否JSONを保存しました。Codexへ渡して「正式反映して」と伝えてください。');});
$('#import').addEventListener('change',async e=>{try{const file=e.target.files[0];if(file)importData(JSON.parse(await file.text()));}catch(err){notice('読み込みできません：'+err.message);}});
kind.addEventListener('change',()=>{places();show();});place.addEventListener('change',()=>show());view.addEventListener('change',()=>show());$('#search').addEventListener('input',()=>show());$('#more').addEventListener('click',()=>{limit+=36;show(false);});
places();show();if(!storageAvailable)notice('ブラウザー保存が使えません。採否をファイルへ保存してください。');
</script></main></body></html>
