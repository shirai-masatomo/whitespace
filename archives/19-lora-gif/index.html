<h1>構図固定のGIF試作</h1><p>同じ原画から3種類。顔・体の位置は固定し、各GIFの必要領域だけ変更。GIFは256色のため原寸PNGとは色差があります。下の画像は繰り返し再生します。</p><main><section><h2>①まばたき</h2><img src="../../media/0869330006f3d10df326.gif" alt="①まばたき"><p>目を閉じる短い2段階の差分。体・口・背景は固定。</p><a href="../../media/0869330006f3d10df326.gif" download>GIFを開く・保存</a></section><section><h2>②小さな呼吸</h2><img src="../../media/f867bd17fc789ea50de4.gif" alt="②小さな呼吸"><p>衣服の一部を最大3.2px動かした2D試作。体全体の自然な呼吸は未検証。</p><a href="../../media/f867bd17fc789ea50de4.gif" download>GIFを開く・保存</a></section><section><h2>③恋愛表情の変化</h2><img src="../../media/1a2ebee6c142e3f9212c.gif" alt="③恋愛表情の変化"><p>照れた微笑みから笑顔へ。口元の差分を短くフェードし、目・体は固定。</p><a href="../../media/1a2ebee6c142e3f9212c.gif" download>GIFを開く・保存</a></section></main><p><a href="../../media/bab6e20cce800bbde8ee.jpg">生成した表情の静止比較</a> / <a href="../../reports/COVERAGE.html#同梱しないもの">画素固定・フレーム検査記録</a></p></html>
